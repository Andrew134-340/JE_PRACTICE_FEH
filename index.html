<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>FEH Practice</title>
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

<style>
.btn-custom {
            width: 220px;
            font-size: 18px;
            font-weight: bold;
            padding: 12px;
            border-radius: 8px;
            transition: all 0.3s ease-in-out;
        }

        .btn-custom:hover {
            transform: scale(1.1);
            box-shadow: 0px 0px 12px rgba(255, 255, 255, 0.3);
</style>


</head>
<body>

<div class="container">
	<details ontoggle ="message()">
<summary> Instructions </summary>
<i>Enter two numbers and find their sum.</i>
	</details>

<form>
	<label> Enter 1st Number NOW! </label>
	<input type="number" id ="num1" placeholder="type here... if you want to... I don't know...">
<br>
	<label> Enter 2nd Number THIS INSTANT! </label>
	<input type="number" id="num2" placeholder="type here... I think?">
<br>
<button type="button" class="btn btn-primary btn-custom" onclick="plus()">Calculate for the Sum</button>
<br>
<br>
<button type="button" class="btn btn-primary btn-custom" onclick="minus()">Calculate for the Difference</button>

<br>
<br>
<br>
<span> <h1 id="result"> Answer: </h1> </span>

</form>



</div>

<script>

function message(){

alert("Try it!");

}

function plus () {

	var add1 = document.getElementById ("num1").value;
	var add2 = document.getElementById ("num2").value;
	var sum = Number(add1) + Number (add2);

	document.getElementById('result').innerHTML = 'Answer is' + ' ' + sum;
}

function minus () {

	var add1 = document.getElementById ("num1").value;
	var add2 = document.getElementById ("num2").value;
	var sum = Number(add1) - Number (add2);

	document.getElementById('result').innerHTML = 'Answer is' + ' ' + sum;
}


</script>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
